<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Helvetica Neue, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="720" height="260" fill="#ffffff"/>
  <!-- frames -->
  <g stroke="#9aa5b1" fill="#eef2f6">
    <rect x="30" y="40" width="90" height="70" rx="3"/>
    <rect x="30" y="150" width="90" height="70" rx="3"/>
  </g>
  <text x="75" y="80" text-anchor="middle" fill="#333">o<tspan font-size="10" dy="4">t</tspan></text>
  <text x="75" y="190" text-anchor="middle" fill="#333">o<tspan font-size="10" dy="4">t+1</tspan></text>
  <!-- encoder -->
  <path d="M190 70 L290 100 L290 160 L190 190 Z" fill="#dbe7f4" stroke="#1f5c99" stroke-width="1.5"/>
  <text x="240" y="134" text-anchor="middle" fill="#12406f" font-weight="600">Encoder E</text>
  <line x1="120" y1="75" x2="188" y2="100" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="120" y1="185" x2="188" y2="160" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- latent -->
  <rect x="330" y="108" width="60" height="44" rx="3" fill="#fff1b8" stroke="#b08a00" stroke-width="1.5"/>
  <text x="360" y="135" text-anchor="middle" fill="#5c4700" font-style="italic">z<tspan font-size="10" dy="4">t</tspan></text>
  <line x1="290" y1="130" x2="328" y2="130" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="360" y="176" text-anchor="middle" fill="#777" font-size="12">bottleneck</text>
  <!-- decoder -->
  <path d="M430 100 L530 70 L530 190 L430 160 Z" fill="#e3efe6" stroke="#2f7a4b" stroke-width="1.5"/>
  <text x="480" y="134" text-anchor="middle" fill="#1f5233" font-weight="600">Decoder D</text>
  <line x1="390" y1="130" x2="428" y2="130" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M120 50 C 260 10, 400 10, 470 86" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="300" y="26" text-anchor="middle" fill="#888" font-size="12">o<tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> (context)</tspan></text>
  <!-- prediction -->
  <rect x="580" y="95" width="90" height="70" rx="3" fill="#eef2f6" stroke="#9aa5b1" stroke-dasharray="5 3"/>
  <text x="625" y="135" text-anchor="middle" fill="#333">ô<tspan font-size="10" dy="4">t+1</tspan></text>
  <line x1="530" y1="130" x2="578" y2="130" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="360" y="240" text-anchor="middle" fill="#888" font-size="12">Demo figure — placeholder diagram</text>
</svg>
